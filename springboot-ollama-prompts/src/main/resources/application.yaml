spring:
  application:
    name: springboot-ollama-prompts

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/spring-ai
    username: ai
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  ai:

    ## Ollama Configuration (Docker)
    model:
      chat: ollama

    ollama:
      base-url: http://localhost:11434

      chat:
        model: llama3.2:latest
    ## end

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
            schema: classpath:schema/schema-mysql.sql
#  sql:
#    init:
#      mode: always
#      schema-locations: classpath:schema/schema-mysql.sql

## Ollama Configuration (Install in the system)
